<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glücksrad-Abstimmung</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="card">
        <h1>Glücksrad-Abstimmung</h1>
        <p class="intro">
          Erstelle eine einfache Abstimmung, sammle Stimmen und lasse das Glücksrad entscheiden.
        </p>

        <section id="setup-section">
          <label class="field">
            <span>Abstimmungsfrage</span>
            <input id="question-input" type="text" placeholder="Zum Beispiel: Was soll wir heute essen?" />
          </label>

          <label class="field">
            <span>Abstimmungsmodus</span>
            <label class="mode-toggle">
              <input id="room-mode-toggle" type="checkbox" />
              <span>Raum-Modus aktivieren (mehrere Personen, Ergebnisse erst am Ende sichtbar)</span>
            </label>
            <label class="mode-toggle">
              <input id="online-mode-toggle" type="checkbox" />
              <span>Online-Modus mit Supabase aktivieren</span>
            </label>
          </label>

          <div class="answers-box">
            <h2>Antwortmöglichkeiten</h2>
            <div id="answers-container">
              <div class="answer-row">
                <input class="answer-input" type="text" placeholder="Antwort 1" />
                <button class="remove-answer-btn" type="button">Entfernen</button>
              </div>
              <div class="answer-row">
                <input class="answer-input" type="text" placeholder="Antwort 2" />
                <button class="remove-answer-btn" type="button">Entfernen</button>
              </div>
            </div>
            <button id="add-answer-btn" type="button">Weitere Antwortmöglichkeit hinzufügen</button>
          </div>

          <div class="answers-box">
            <h2>Online teilnehmen</h2>
            <label class="field">
              <span>Raumcode eingeben</span>
              <input id="join-room-code-input" type="text" placeholder="Zum Beispiel: AB12" />
            </label>
            <button id="join-online-btn" type="button">Online-Abstimmung beitreten</button>
            <p id="join-error" class="error"></p>
          </div>

          <p id="setup-error" class="error"></p>
          <button id="start-btn" type="button">Abstimmung starten</button>
        </section>

        <section id="vote-section" hidden>
          <h2 id="question-display"></h2>
          <p class="info" id="vote-info">Die Ergebnisse bleiben bis zum Ende verborgen.</p>
          <p id="room-status" class="room-status" hidden></p>
          <p id="online-status" class="room-status" hidden></p>

          <label class="field">
            <span>Dein Name</span>
            <input id="voter-name" type="text" placeholder="Zum Beispiel: Mia" />
          </label>

          <label class="field">
            <span>Wähle eine Antwort</span>
            <select id="vote-select"></select>
          </label>

          <div class="action-row">
            <button id="vote-btn" type="button">Stimme abgeben</button>
            <button id="next-person-btn" type="button" hidden>Nächste Person</button>
            <button id="end-voting-btn" type="button">Abstimmung beenden</button>
          </div>

          <p id="vote-confirmation" class="confirm"></p>
          <button id="new-voting-btn-vote" type="button" class="secondary-btn">Neue Abstimmung</button>
        </section>

        <section id="results-section" hidden>
          <h2>Ergebnis der Abstimmung</h2>
          <ul id="results-list" class="results-list"></ul>

          <div class="wheel-area">
            <div class="wheel-pointer"></div>
            <div id="wheel" class="wheel"></div>
          </div>

          <div class="wheel-controls">
            <button id="spin-btn" type="button">Glücksrad drehen</button>
            <button id="stop-btn" type="button">Glücksrad stoppen</button>
          </div>

          <p id="winner-display" class="winner"></p>
          <button id="new-voting-btn-results" type="button" class="secondary-btn">Neue Abstimmung</button>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
